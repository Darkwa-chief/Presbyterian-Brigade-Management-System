name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            script: |
                cd /var/www/html
                sudo mv config/database.php /home/ubuntu/database.php.bak
                sudo mv config/app.php /home/ubuntu/app.php.bak
                sudo git pull origin main
                sudo cp /home/ubuntu/database.php.bak /var/www/html/config/database.php
                sudo cp /home/ubuntu/app.php.bak /var/www/html/config/app.php
                sudo chown -R www-data:www-data /var/www/html/
                sudo systemctl restart nginx
                sudo systemctl restart php8.5-fpm
                echo "Deployment complete!"
